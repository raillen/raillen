name: Update profile metrics

on:
  workflow_dispatch:
  schedule:
    - cron: "43 8 * * *"
  push:
    branches:
      - main
    paths:
      - "scripts/update_metrics.py"
      - ".github/workflows/profile-metrics.yml"

permissions:
  contents: write

jobs:
  update-metrics:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Generate ecosystem metrics
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_metrics.py

      - name: Commit changed metrics
        run: |
          if git diff --quiet -- assets/lab-pulse-dark.svg assets/lab-pulse-light.svg assets/lab-pulse.json; then
            echo "Metrics are already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/lab-pulse-dark.svg assets/lab-pulse-light.svg assets/lab-pulse.json
          git commit -m "chore(profile): refresh lab pulse"
          git push
